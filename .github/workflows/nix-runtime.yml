name: Nix runtime

on:
  workflow_dispatch:
  # pull_request:
  #   branches:
  #     - main
  #   paths:
  #     - "flake.nix"
  #     - "flake.lock"
  #     - "nix/**"
  #     - ".github/workflows/nix-runtime.yml"

permissions:
  contents: read

jobs:
  nix-runtime:
    name: Nix runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Node.js and pnpm
        run: |
          nix develop .#ci -c node --version
          nix develop .#ci -c pnpm --version

      - name: Install dependencies
        run: nix develop .#ci -c pnpm install --frozen-lockfile

      - name: Build
        run: nix develop .#ci -c pnpm build
